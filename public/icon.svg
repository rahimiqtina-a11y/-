<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0D253F"/>
      <stop offset="100%" stop-color="#020C1B"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="256" r="140" fill="#00A896" opacity="0.15" filter="url(#glow)"/>

  <!-- Briefcase & Gulf Emblem Design -->
  <g transform="translate(96, 106)">
    <!-- Briefcase Handle -->
    <path d="M 100 80 C 100 45, 120 20, 160 20 C 200 20, 220 45, 220 80" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Main Briefcase Body -->
    <rect x="20" y="80" width="280" height="190" rx="28" fill="url(#tealGrad)" filter="url(#glow)"/>

    <!-- Accent Overlay & Flap -->
    <path d="M 20 140 L 160 185 L 300 140 L 300 108 C 300 92.5 287.5 80 272 80 L 48 80 C 32.5 80 20 92.5 20 108 Z" fill="#0A192F" opacity="0.25"/>

    <!-- Lock Clasp / Star Emblem -->
    <circle cx="160" cy="185" r="22" fill="url(#goldGrad)"/>
    <circle cx="160" cy="185" r="10" fill="#0A192F"/>

    <!-- Modern GCC Star Points / Growth Arrow -->
    <path d="M 160 230 L 175 255 L 205 255 L 180 270 L 190 295 L 160 280 L 130 295 L 140 270 L 115 255 L 145 255 Z" fill="#FCD34D" opacity="0.9"/>
  </g>

  <!-- Arabic Typography / Modern Monogram Accent -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">وظائف الخليج</text>
  <text x="256" y="470" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#2DD4BF" text-anchor="middle" letter-spacing="4">GULF JOBS</text>
</svg>
